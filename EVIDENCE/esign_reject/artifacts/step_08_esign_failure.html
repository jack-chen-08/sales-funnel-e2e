<!DOCTYPE html><html lang="zh-CN"><head>
  <meta charset="utf-8">
  <title>会员空间平台 · 招商链路冒烟</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif; background: #f4f6f9; color: #1f2933; }
    header { background: #14304f; color: #fff; padding: 14px 28px; font-size: 15px; letter-spacing: .5px; }
    header span { opacity: .75; font-size: 12px; margin-left: 12px; }
    main { max-width: 720px; margin: 32px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 10px; padding: 28px 32px; box-shadow: 0 6px 20px rgba(15, 35, 60, .08); }
    h1 { font-size: 20px; margin: 0 0 18px; }
    label { display: block; margin-bottom: 14px; font-size: 13px; color: #52606d; }
    input, select { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 9px 11px;
      border: 1px solid #cbd2d9; border-radius: 6px; font-size: 14px; background: #fff; }
    button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: 10px 20px;
      font-size: 14px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    .hint { font-size: 12px; color: #7b8794; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; background: #e3f0ff; color: #1f6feb; font-size: 12px; }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #e4e7eb; font-size: 14px; }
    .error { color: #c0392b; font-weight: 600; }
    .ok { color: #1e8449; font-weight: 600; }
    code { background: #eef1f5; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
<header>会员空间平台 · 招商全链路冒烟<span>冒烟环境 / 虚构数据</span></header>
<main>
  
<section class="card">
  <h1>电子签签约台</h1>
  <div class="row"><span>信封编号</span><code id="envelope-no">ESN-C8317EC291</code></div>
  <div class="row"><span>签署状态</span><span class="badge" id="sign-status" data-status="rejected">签署失败</span></div>
  <ul id="signer-list" style="font-size:13px;color:#52606d;padding-left:18px">
    
    <li data-party="landlord">园区运营主体（虚构） —— 待签</li>
    
    <li data-party="tenant">星澜数字科技（虚构） / 林知远（虚构） —— 待签</li>
    
  </ul>
  <p class="hint">桩实现：出租方与承租方两方签署，签署结果由电子签桩返回。</p>
  <button id="btn-sign-all" data-run-id="smk-reject-20261124-033728-deb2" data-envelope-id="dc28cf17-e1b7-4132-bde5-f0bf73fb8a4c" disabled="">双方签署</button>
  <p id="sign-result" class="hint"></p>
  <p id="sign-error" class="error">签约方拒签：签约方在签署页点击拒签（电子签桩模拟）</p>
</section>
<script>
  const btn = document.getElementById('btn-sign-all');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    const res = await fetch('/api/esign/sign', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Run-Id': btn.dataset.runId },
      body: JSON.stringify({ envelope_id: btn.dataset.envelopeId })
    });
    const body = await res.json();
    const badge = document.getElementById('sign-status');
    const out = document.getElementById('sign-result');
    const err = document.getElementById('sign-error');
    if (res.ok) {
      badge.textContent = '已完成双方签署';
      badge.dataset.status = body.envelope_status;
      out.className = 'ok';
      out.textContent = '签署完成：' + body.envelope_no;
    } else {
      badge.textContent = '签署失败';
      badge.dataset.status = body.envelope_status || 'rejected';
      err.hidden = false;
      err.textContent = '签约方拒签：' + (body.reject_reason || JSON.stringify(body));
    }
  });
</script>

</main>

</body></html>
